name: BET weekly BVB snapshot

on:
  schedule:
    - cron: "30 7 * * 6"
  workflow_dispatch:
    inputs:
      day:
        description: "Optional BVB day in yyyymmdd format"
        required: false
        type: string

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Fetch BVB snapshot
        env:
          SNAPSHOT_DAY: ${{ inputs.day }}
        run: |
          if [ -n "$SNAPSHOT_DAY" ]; then
            node scripts/bet-report.js snapshot --day "$SNAPSHOT_DAY"
          else
            node scripts/bet-report.js snapshot
          fi

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bvb_weekly_snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Archive weekly BVB BET snapshot"
            git push
          fi
