name: BET monthly performance report

on:
  pull_request:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Optional report month in YYYY-MM format"
        required: false
        type: string
      send_email_only:
        description: "Skip report generation and only send the email for an existing report"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  regression-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run regression tests
        run: npm run test:regression

  report:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Resolve report month
        id: month
        shell: bash
        env:
          MONTH_INPUT: ${{ inputs.month }}
        run: |
          if [ -n "$MONTH_INPUT" ]; then
            echo "value=$MONTH_INPUT" >> "$GITHUB_OUTPUT"
          else
            node -e 'const d = new Date(); const y = d.getUTCMonth() === 0 ? d.getUTCFullYear() - 1 : d.getUTCFullYear(); const m = d.getUTCMonth() === 0 ? 12 : d.getUTCMonth(); console.log("value=" + y + "-" + String(m).padStart(2, "0"));' >> "$GITHUB_OUTPUT"
          fi

      - name: Check email-only mode
        id: mode
        shell: bash
        env:
          SEND_EMAIL_ONLY: ${{ inputs.send_email_only }}
        run: |
          if [ "$SEND_EMAIL_ONLY" = "true" ]; then
            echo "email_only=true" >> "$GITHUB_OUTPUT"
            echo "Manual email-only run enabled for month ${{ steps.month.outputs.value }}."
          else
            echo "email_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check email configuration
        id: email
        shell: bash
        env:
          MONTHLY_REPORT_EMAIL_ENABLED: ${{ vars.MONTHLY_REPORT_EMAIL_ENABLED }}
          MONTHLY_REPORT_EMAIL_FROM: ${{ vars.MONTHLY_REPORT_EMAIL_FROM }}
          MONTHLY_REPORT_EMAIL_TO: ${{ vars.MONTHLY_REPORT_EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ "$MONTHLY_REPORT_EMAIL_ENABLED" = "true" ] && [ -n "$MONTHLY_REPORT_EMAIL_FROM" ] && [ -n "$MONTHLY_REPORT_EMAIL_TO" ] && [ -n "$RESEND_API_KEY" ]; then
            echo "can_send=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_send=false" >> "$GITHUB_OUTPUT"
            echo "Monthly email is disabled or incomplete; send step will be skipped."
          fi

      - name: Generate monthly report
        if: ${{ steps.mode.outputs.email_only != 'true' }}
        run: node scripts/bet-report.js report --month "${{ steps.month.outputs.value }}"

      - name: Commit report
        if: ${{ steps.mode.outputs.email_only != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Generate BET monthly performance report"
            git push
          fi
      - name: Wait for Pages deployment
        if: ${{ steps.mode.outputs.email_only != 'true' && steps.email.outputs.can_send == 'true' }}
        run: sleep 600
      - name: Send monthly report email
        if: ${{ steps.email.outputs.can_send == 'true' }}
        env:
          MONTHLY_REPORT_EMAIL_ENABLED: ${{ vars.MONTHLY_REPORT_EMAIL_ENABLED }}
          MONTHLY_REPORT_EMAIL_FROM: ${{ vars.MONTHLY_REPORT_EMAIL_FROM }}
          MONTHLY_REPORT_EMAIL_TO: ${{ vars.MONTHLY_REPORT_EMAIL_TO }}
          MONTHLY_REPORT_SITE_URL: ${{ vars.MONTHLY_REPORT_SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/bet-report.js send-email --month "${{ steps.month.outputs.value }}"
